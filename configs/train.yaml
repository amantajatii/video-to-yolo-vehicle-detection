# Training configuration for the vehicle detector (Ultralytics YOLO).
# Every key is passed unchanged to `YOLO(model).train(...)` by scripts/train.py.

model: yolo11n.pt            # COCO-pretrained nano model, fine-tuned (lightweight, CPU/MPS friendly)
data: data/dataset/data.yaml
project: runs
name: yolo11n_vehicle

# Schedule
epochs: 100
patience: 25                 # early stopping on val fitness
batch: 8
imgsz: 960                   # > 640 on purpose: many vehicles are small/distant (median box side ~35 px at 1920 px)

# Optimiser (set explicitly so the report states the real values instead of "auto")
optimizer: AdamW
lr0: 0.001
lrf: 0.01                    # final LR = lr0 * lrf
momentum: 0.937
weight_decay: 0.0005
warmup_epochs: 3
cos_lr: false

# Augmentation (Ultralytics defaults, listed for the report)
mosaic: 1.0
close_mosaic: 10             # disable mosaic for the last 10 epochs
fliplr: 0.5
hsv_h: 0.015
hsv_s: 0.7
hsv_v: 0.4
scale: 0.5
translate: 0.1

# Reproducibility / runtime
seed: 42
deterministic: true
device: mps                  # Apple Silicon GPU; use "cpu" or "0" (CUDA) elsewhere
workers: 4
cache: true                  # 380 images fit in RAM
plots: true
exist_ok: false
